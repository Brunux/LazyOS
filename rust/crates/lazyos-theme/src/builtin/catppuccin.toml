# Catppuccin Mocha - https://github.com/catppuccin/catppuccin
#
# The 16 colours are the palette's own mapping: `regular0`/`bright0` are the
# surface greys, `regular7`/`bright7` the text greys, and the accents sit where a
# terminal puts them. The accent is mauve, which is what makes a Catppuccin
# window recognisable at a glance.
name = "Catppuccin Mocha"
author = "Catppuccin"
source = "https://github.com/catppuccin/catppuccin"

wallpapers = ["catppuccin-totoro.jpg", "catppuccin-waves.jpg", "catppuccin-blue-eye.jpg"]
motion = "full"

[colors]
background = "#1e1e2e"
foreground = "#cdd6f4"
regular0 = "#45475a"
regular1 = "#f38ba8"
regular2 = "#a6e3a1"
regular3 = "#f9e2af"
regular4 = "#89b4fa"
regular5 = "#f5c2e7"
regular6 = "#94e2d5"
regular7 = "#bac2de"
bright0 = "#585b70"
bright1 = "#f38ba8"
bright2 = "#a6e3a1"
bright3 = "#f9e2af"
bright4 = "#89b4fa"
bright5 = "#f5c2e7"
bright6 = "#94e2d5"
bright7 = "#a6adc8"

[roles]
accent = "#cba6f7"
accent_alt = "#89b4fa"
surface = "#181825"
selection = "#313244"
