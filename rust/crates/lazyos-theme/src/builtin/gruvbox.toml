# Gruvbox Dark - https://github.com/morhetz/gruvbox
#
# The bright ANSI set is the readable one here: this palette's regular red is
# 2.4:1 against its own background, which is a mood rather than a warning, so the
# roles a surface uses as a signal name the bright pair.
name = "Gruvbox Dark"
author = "Pavel Pertsev"
source = "https://github.com/morhetz/gruvbox"

wallpapers = ["gruvbox-the-backwater.jpg", "gruvbox-village-square.jpg", "gruvbox-flower-basket.jpg", "gruvbox-leaves.jpg"]
motion = "full"

[colors]
background = "#282828"
foreground = "#ebdbb2"
regular0 = "#282828"
regular1 = "#cc241d"
regular2 = "#98971a"
regular3 = "#d79921"
regular4 = "#458588"
regular5 = "#b16286"
regular6 = "#689d6a"
regular7 = "#a89984"
bright0 = "#928374"
bright1 = "#fb4934"
bright2 = "#b8bb26"
bright3 = "#fabd2f"
bright4 = "#83a598"
bright5 = "#d3869b"
bright6 = "#8ec07c"
bright7 = "#ebdbb2"

[roles]
accent = "#fabd2f"
accent_alt = "#83a598"
surface = "#32302f"
selection = "#3c3836"
ok = "#b8bb26"
warn = "#fabd2f"
danger = "#fb4934"
info = "#83a598"
