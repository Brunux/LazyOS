[package]
name = "lazyos-cli"
# The version the binary reports comes from the repository's VERSION file,
# compiled in below; this one only satisfies cargo and never ships.
version = "0.0.0"
edition = "2024"
description = "The LazyOS multi-call session binary"

[[bin]]
name = "lazyos"
path = "src/main.rs"

[dependencies]
lazyos-theme = { path = "../lazyos-theme" }
lazyos-ui = { path = "../lazyos-ui" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# Signals: restoring the terminal on SIGINT/SIGTERM needs `signal(2)` and
# `write(2)` from a handler. crossterm depends on libc already, and using it
# directly keeps the dependency count at one small crate instead of a wrapper.
libc = "0.2"
# The menu's frecency file and the agents' JSON answers (spec 007). Both are
# already in the tree through lazyos-ui, so this adds no crate to the build.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The Ask answer is wrapped to the card's width in cells, not bytes.
unicode-width = "0.2"
