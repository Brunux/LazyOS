# keyd keymap for the Google Hayato (MT8192 "asurada") Chromebook.
#
# Ported from the maintainer's Nura (postmarketOS) session: the layers are
# verbatim, the [ids] section is not (see the notes there).  The original also
# lived in /tmp behind a symlink -- a tmpfs file that disappears on reboot --
# and because keyd reads its configuration only at startup, a config written
# after boot is never picked up (the likely reason virtual-terminal switching
# did not work on Nura).
#
# Why a key remapper at all: the hayato device tree maps the top row to *action*
# keys (KEY_BACK, KEY_FORWARD, KEY_REFRESH, KEY_FULL_SCREEN, KEY_SCALE,
# KEY_BRIGHTNESS{DOWN,UP}, KEY_MUTE, KEY_VOLUME{DOWN,UP}), so this keyboard never
# emits F1-F10.  Reaching a virtual terminal needs a real F-key keycode: the
# kernel maps Ctrl+Alt+F<n> to Console_<n>, and sway/wlroots reacts to the
# XF86Switch_VT_<n> keysym that the same keycode produces.  keyd supplies the
# missing F-keys without giving up the action keys.
#
# Layers:
#   [main]         top row = ChromeOS action keys (what the device tree does)
#   [meta]         Search + top row     -> F1-F10
#   [control+alt]  Ctrl+Alt + top row   -> Ctrl+Alt+F1-F10 -> VT 1-10
#   [alt]          Alt+Backspace = Delete; Alt+brightness = keyboard backlight
#   [control]      Ctrl+F5 / Ctrl+Scale = SysRq
#   [altgr]        Backspace = Delete, arrows = Home/End/PgUp/PgDn
#
# Worth knowing:
#   * the Lock key (KEY_SLEEP) is deliberately *not* remapped.  systemd-logind
#     suspends on that key by itself, and that is the only suspend path that
#     needs neither polkit nor an active session.  Nura's generated config maps
#     `sleep = coffee` (KEY_COFFEE, the kernel's lock/screensaver key) instead:
#     because keyd grabs the keyboard, logind stops seeing KEY_SLEEP, and since
#     nothing consumes KEY_COFFEE either, the Lock key there does nothing at all.
#     The first boot of this image suspended on the key; configuring keyd broke
#     it, so the mapping stays out.  etc/sway/config.d/21-lock-screen.conf binds
#     the XF86Sleep keysym to swaylock, so the key still locks *and* sleeps:
#     swaylock draws while logind suspends (~0.3 s later).
#   * `f13 = coffee` is kept for parity with Nura; this keyboard never emits F13.
#   * the `[main] f1..f10` lines only fire on keyboards that really emit F-keys;
#     the hayato device tree does not, so they are inert here (kept for parity).
#
# Emergency exit: keyd quits on backspace+escape+enter, releasing the keyboard.

[ids]
# The internal cros-ec keyboard reports vendor 0000 / product 0000, and keyd
# matches ids as prefixes, so "k:0000:0000" covers it.  Two other devices share
# that vendor:product and must NOT be grabbed:
#
#   * cros_ec_buttons: the power button, the volume buttons and the lid and
#     tablet-mode switches (EV_SW).  keyd counts it as a keyboard only because
#     it reports KEY_VOLUMEUP/DOWN (a heuristic for laptops whose hotkeys live
#     on a separate node), and its virtual device does not forward EV_SW, so
#     grabbing it would leave the machine unable to suspend on lid close and
#     would take the power button away from systemd-logind.
#   * the headset jack: its EV_SW events (headphone/microphone insertion) would
#     be lost the same way, and it only looks like a keyboard for the same
#     reason (it reports the headset's volume keys).
#
# keyd returns on the first matching entry, so exclusions have to come first.
# The ids are hashes of the device name, its key count and the abs/rel masks;
# list them with `keyd.rvaiya monitor`, or read `journalctl -u keyd` after a
# boot (it logs which devices it matched), if a kernel update changes them.
-0000:0000:c68a2d8e
-0000:0000:3c5e67dc

# The rest are Google USB keyboards, kept from the original config.
k:0000:0000
k:0001:0001
k:18d1:5061
k:18d1:502b
k:18d1:5052
k:18d1:503d
k:18d1:504c
k:18d1:503c
k:18d1:5044
k:18d1:505b
k:18d1:5050
k:18d1:5057
k:18d1:5030

