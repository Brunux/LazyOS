<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
<!-- Map common modern coding fonts to the generic monospace family when uninstalled,
     ensuring browsers and editors fall back cleanly to a monospaced text font (DejaVu Sans Mono)
     rather than a proportional sans font. -->
  <alias>
    <family>Fira Code</family>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>Roboto Mono</family>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>Source Code Pro</family>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>Cascadia Code</family>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>Hack</family>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>Ubuntu Mono</family>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>JetBrains Mono</family>
    <default><family>monospace</family></default>
  </alias>
</fontconfig>
