# SwayFX effects: rounded corners, shadows, a blur that costs nothing on a tiled
# window while it is still, and short animations.
#
# The compositor is the wlroots fork built from compositors/swayfx (it installs
# /usr/bin/sway under the name swayfx), so plain sway rejects the directives
# below instead of starting without the effects.
#
# What each effect costs on this machine's Mali-G57 (panfrost/PanVK facts and
# the numbers in docs/optimization.md, measured at the panel's 1366x912):
#
#   corner_radius / smart_corner_radius  the corners are cut out of the
#       window's own buffer when it is committed, so nothing is done per frame.
#       smart_corner_radius only rounds when there is a gap around the window,
#       which is the case here (gaps inner 8, outer 4 in 90-solarized.conf).
#   shadows  one blurred texture per window, drawn once per frame.
#   blur     SceneFX has two ways to produce it, and the difference is the whole
#       reason this can be on:
#
#       * a tiled window that cannot overlap another one (neither floating nor
#         animating, which is the common case) uses the *cached* blur: the
#         wallpaper is blurred once per output, into an offscreen buffer, and
#         the window then samples that texture - one bilinear tap per pixel.
#         Measured full-screen: 0.07-0.11 ms/frame.
#       * a floating window, or one that can overlap another, is blurred live
#         from what is actually behind it: two downsample and two upsample
#         passes (5 and 9 taps) plus the final draw. Measured full-screen at
#         radius 4 / 2 passes: 2.1-2.2 ms/frame, and it scales with the window
#         area - a 1200x800 floating window pays about 1.5 ms. Only while that
#         window is on screen and something damages it.
#
# `blur_xray` decides which of the two a window gets. Enabled, *every* surface
# samples the cached wallpaper blur, including floating windows - cheapest, but
# a floating window then shows the wallpaper through it instead of the window
# behind, which is visible (verified with a screenshot) and is not what this
# session wants. Disabled (below) a tiled window still gets the cached path, so
# the common case stays free, and only floating windows pay for a live blur -
# plus, with the animations below on, each window for the duration of its own
# animation, because `could_container_overlap()` counts an initialized
# animation as "can overlap" (sway/desktop/output.c).
blur enable
blur_xray disable
# Animations, kept to one modest duration, because that is all swayfx 0.6 has:
# there are no Hyprland-style per-event `animation <event> ...` directives and
# no curves, just `animation_duration_ms` (a float, 0-5000) driving every
# animation it implements with a fixed ease-out-cubic.
#
# What it animates: open (pop-in from 80 % size at the window's centre while
# fading in), close (the same in reverse), every tiling move and resize (a
# window opening or closing beside it, a layout change, gap changes), and the
# workspace cross-fade (the old workspace fades out while the new one fades in;
# skipped when either workspace is fullscreen). Interactive resizing and
# dragging a floating window snap instead of lagging behind the pointer, since
# swayfx bypasses the animation for both - only the compositor's own geometry
# changes are animated.
#
# 150 ms is about 9 frames at 60 Hz, clipped by the frame timer: quick enough
# to read as a transition rather than a delay. The blur is what it costs. A
# full-screen window takes the live path above for the length of the animation
# (2.1-2.2 ms/frame measured, 1.5 ms for a 1200x800 one), and a workspace switch
# animates both workspaces, so the frames during it carry both blurs. Setting
# this to 0 at runtime (`swaymsg animation_duration_ms 0`) gives the cached path
# back to every tiled window without restarting the session.
animation_duration_ms 150
# radius 4 x 2 passes = a 32 px sample (SceneFX's blur_data_calc_size is
# 2^(passes+1) * radius; the shipped defaults of 5 x 3 are 80 px). The radius is
# also how far every damage region of a *live* blur is grown, so this is the
# number that decides how much is re-rendered around a floating window. 32 px
# is already a heavy frost at this screen size (checked in a nested swayfx
# session against a high-contrast test pattern).
blur_passes 2
blur_radius 4
# No noise, no tint. SceneFX runs a second full-screen pass over a live blur
# for brightness/contrast/saturation/noise, and skips it only when all four are
# neutral - 0.6 ms/frame on a floating window, plus visible grain in the
# case of noise. For the cached path the pass runs once, when the wallpaper is
# blurred, so the tint would be free there; `blur_brightness 0.9` is the line to
# add if a dimmer frost is ever wanted. The wallpaper here is dark enough that
# the terminal's 0.92 alpha keeps its text readable without it.
blur_noise 0
blur_brightness 1.0
blur_contrast 1.0
blur_saturation 1.0
# Blur is drawn *behind* a surface, so it is invisible under a fully opaque
# one. The surfaces that reveal it are the ones with alpha < 1:
#   ~/.config/foot/foot.ini       alpha = 0.92  (the terminal)
#   ~/.config/rofi/solarized.rasi rgba()        (launcher, switcher, bar menus)
#   ~/.config/waybar/style.css    rgba()        (the bar and its cards)
# Everything else in the session is opaque on purpose (a video, a PDF viewer),
# and needs no rule: an opaque window simply shows its own pixels.
#
# The bar and the launcher are layer-shell surfaces, so they get their blur
# from `layer_effects` rather than from `blur`. The bar only ever has the
# wallpaper behind it, so it takes the cached path and costs a texture sample.
# The launcher floats over whatever is on screen, so it blurs that (xray off);
# it only repaints while it is open and a key is pressed.
layer_effects "waybar" {
	blur enable
	blur_xray enable
}
layer_effects "rofi" {
	blur enable
	blur_xray disable
}
layer_effects "lazyos-notify" {
	blur enable
	blur_xray disable
	shadows disable
	corner_radius 6
}
corner_radius 6
smart_corner_radius enable
shadows enable
# foot draws no client-side decorations (it uses the server side, i.e. nothing,
# under sway), so this only matters for an application that brings its own
# titlebar: a shadow under one of those does not fit and looks like a second
# border.
shadows_on_csd disable
# Inactive windows are not dimmed: the solarized palette already lowers the
# contrast of unfocused borders, and dimming a terminal makes its text grey.
default_dim_inactive 0.0
