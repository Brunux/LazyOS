# The local model window (~/.config/bin/lazyos-model) opens foot with this
# app-id, so it can be floated and centred instead of tiling: a conversation is
# something to read, and a tiled terminal would take the whole workspace away
# from whatever was open. 1000x700 on the 1366x912 internal panel leaves the 30 px
# bar, a margin on each side and a few turns visible; on the 1920x1080 external
# monitor the same window is proportionally smaller, which is the harmless
# direction to be wrong in.
for_window [app_id="lazyos-model"] floating enable
for_window [app_id="lazyos-model"] resize set 1000 700
for_window [app_id="lazyos-model"] move position center
