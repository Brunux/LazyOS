# The theme engine's two keys (spec 004).
#
# `lazyos theme set` writes every generated file, and the two keys below run the
# engine itself: they open no window, they raise no card, and they cost nothing
# when unused - one process that writes a few files and exits.
#
# A theme switch repaints the bar (waybar reloads its stylesheet), the
# notifications (makoctl reload) and the window frame and wallpaper (swaymsg
# reload). A terminal that is already open keeps its palette: foot reads its
# configuration when a window is created, which is why the manual says so.

# Next theme: cycles solarized -> catppuccin -> ... and back, rewriting every surface
bindsym --release Alt+Shift+t exec lazyos theme next
# Next wallpaper of the active theme (with one named, this says there is nothing to cycle)
bindsym --release Alt+Shift+w exec lazyos theme wallpaper next
# Interactive theme selector: browse palettes and wallpapers with live preview
bindsym --release Alt+Shift+c exec lazyos menu theme
