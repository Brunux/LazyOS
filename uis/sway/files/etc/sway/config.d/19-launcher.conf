# The launcher, the command palette and the window switcher: the framework's
# three list surfaces (spec 012), one binary and the session's palette.
#
#   $mod+d     lazyos menu apps    the .desktop entries, including the port's own
#                                 session actions in usr/share/applications/org.lazyos.*
#                                 (the Search key opens the same menu; it is
#                                 bound in ~/.config/sway/config)
#   $mod+Tab   lazyos menu window  the window switcher, over wlroots' foreign-toplevel
#                                 protocol; sway has none of its own
#   $mod+Shift+d
#              lazyos menu run     every executable in $PATH; Enter runs it, and
#                                 Shift+Enter runs it in foot, which is how the
#                                 TUIs from packages/tools.list are started
#
# Each window exits when it closes, so nothing stays resident. `rofi-drun`,
# `rofi-window` and `rofi-run` are the same commands under those names, which is
# what the command table calls them (lazyos --symlinks).

# Applications: the .desktop entries, including the port's own session actions
bindsym $mod+d exec $launcher

# Window switcher: the open windows, over wlroots' foreign-toplevel protocol
bindsym $mod+Tab exec $switcher

# Command palette: every executable in $PATH; Shift+Enter runs it in foot
bindsym $mod+Shift+d exec $runner

# The browser (Omarchy has no key for it: its launcher is the way there).  The
# image ships one browser, firefox-esr, and it is also what xdg-open starts and
# what rofi-files opens a non-text file with, so the key is the direct path to
# the same program.
bindsym $mod+Shift+Return exec firefox-esr
