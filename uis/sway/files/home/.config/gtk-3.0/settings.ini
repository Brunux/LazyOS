[Settings]
# GTK3 settings for the whole session (/home/*/.config/gtk-3.0/settings.ini).
#
# The session's own programs are mostly not GTK windows: foot draws with pixman,
# rofi paints its own surface, the file manager is favnyr - a Slint binary that
# links no GTK and no libgio - and greetd runs a terminal UI. Two things here are
# GTK3: **waybar** (the bar), and **guvcview**, the camera window, which is a GTK3
# program and would render in Adwaita's light grey next to a base03 terminal.
# favnyr reads the icon theme name out of this file too (it parses
# `gtk-3.0/settings.ini` for `gtk-icon-theme-name=`), and anything installed
# later inherits the same palette instead of arriving bright.
#
# Adwaita-dark supplies the layout, the paddings and the widgets; gtk.css next
# to this file repaints the surfaces in the solarized palette.
gtk-theme-name=Adwaita-dark
# The preference as well as the name: a theme that honours only one of the two
# still ends up dark, and a future theme name change does not silently go light.
gtk-application-prefer-dark-theme=1
# The LazyOS theme is the session's icon alphabet (scripts/make-icons.sh renders
# it from Font Awesome) and inherits Adwaita and hicolor, so an application that
# ships its own icon still shows that one in colour. favnyr asks for names
# Adwaita 51 does not have at all - "folder" among them - which is why the
# fourth table there exists.
gtk-icon-theme-name=LazyOS
# One typography for the whole session: the bar, the launcher, the terminal and
# the file list are JetBrains Mono. The bar's own text is what benefits here; a
# GTK3 file manager's list view is the other case - names, sizes and dates line
# up in columns.
gtk-font-name=JetBrains Mono 10
# swayfx animates the window (animation_duration_ms 150); GTK adding its own
# menu and popover transitions on top of that is frames this device notices.
gtk-enable-animations=0
gtk-menu-images=1
gtk-button-images=0
