<text x="279" y="382" class="txt">Network</text><text x="293" y="408" class="muted">Wi-Fi → scan → SSID</text><text x="293" y="430" class="muted">Password → connect</text><text x="293" y="452" class="muted">Saved → forget / confirm</text><text x="293" y="474" class="muted">Ethernet / VPN</text><text x="279" y="510" class="txt">Bluetooth</text><text x="293" y="536" class="muted">Scan → device detail</text><text x="293" y="558" class="muted">Pair → passkey → connect</text><text x="293" y="580" class="muted">Trust / remove / confirm</text><text x="279" y="616" class="txt">Screen sharing / VNC</text><text x="293" y="642" class="muted">Start → security confirm</text><text x="293" y="664" class="muted">Stop → client warning</text><text x="279" y="700" class="txt">Diagnostics</text><text x="293" y="726" class="muted">Route / DNS / gateway</text>
<rect x="479" y="320" width="210" height="510" class="surface2"/>
<text x="496" y="350" class="head">PERSONALIZATION</text>
<text x="496" y="382" class="txt">Appearance</text><text x="510" y="408" class="muted">Theme → preview / apply</text><text x="510" y="430" class="muted">Density / transparency</text><text x="496" y="466" class="txt">Bar layout</text><text x="510" y="492" class="muted">Modules / position</text><text x="510" y="514" class="muted">Overflow / output</text><text x="496" y="550" class="txt">Workspaces</text><text x="496" y="578" class="txt">Keyboard layouts</text><text x="496" y="606" class="txt">Display → brightness</text><text x="496" y="634" class="txt">Sound → audio panel</text><text x="496" y="662" class="txt">Notifications</text><text x="510" y="688" class="muted">History / Mako settings</text><text x="496" y="724" class="txt">Keep awake</text>
