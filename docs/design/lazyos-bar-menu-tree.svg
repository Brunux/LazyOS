<text x="1362" y="350" class="head">DEVELOPER*</text>
<text x="1362" y="382" class="txt">LazyOS status</text><text x="1362" y="412" class="txt">Package manager</text><text x="1376" y="438" class="muted">Lookup / update / task</text><text x="1362" y="474" class="txt">Build tools*</text><text x="1362" y="504" class="txt">GPU status</text><text x="1362" y="534" class="txt">Logs &amp; traces</text><text x="1362" y="564" class="txt">Debug bundle</text><text x="1362" y="640" class="muted">*Hidden if unavailable</text>
</g>
<rect x="45" y="870" width="1510" height="170" class="surface"/>
<text x="70" y="906" class="head">GLOBAL ROUTING RULES</text>
<text x="70" y="940" class="txt">Search → results include category + breadcrumb · Backspace / Left = parent · Escape = close / cancel confirmation</text>
<text x="70" y="970" class="txt">Disabled items explain why · async actions own a task view · destructive actions always require confirmation</text>
<text x="70" y="1000" class="txt">Root palette and indicator context menus share stable action IDs; translated labels never become action identifiers.</text>
<text x="70" y="1024" class="muted">*Conditional on installed backend/provider. Full route IDs and data contract: lazyos-bar-menu-tree.md</text>
</svg>