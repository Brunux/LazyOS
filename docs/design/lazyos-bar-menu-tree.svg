<text x="929" y="350" class="head">FILES &amp; TOOLS</text>
<text x="929" y="382" class="txt">Search files</text><text x="929" y="412" class="txt">File manager</text><text x="929" y="442" class="txt">Terminal</text><text x="929" y="472" class="txt">Clipboard history*</text><text x="929" y="502" class="txt">Help</text><text x="943" y="528" class="muted">LazyOS / bar help</text><text x="943" y="550" class="muted">Keybindings → search</text><text x="929" y="586" class="txt">Diagnostics</text><text x="943" y="612" class="muted">Collect → copy → open</text><text x="929" y="660" class="muted">*Optional provider required</text>
<rect x="1129" y="320" width="210" height="510" class="surface2"/>
<text x="1146" y="350" class="head">SESSION</text>
<text x="1146" y="382" class="txt">Lock</text><text x="1146" y="412" class="txt">Logout → confirm</text><text x="1146" y="442" class="txt">Restart compositor</text><text x="1160" y="468" class="muted">→ confirm</text><text x="1146" y="500" class="txt">Reboot → confirm</text><text x="1146" y="530" class="txt">Shutdown → confirm</text><text x="1146" y="590" class="muted">Cancel is default focus</text><text x="1146" y="616" class="muted">for disruptive actions.</text>
