<text x="62" y="350" class="head">SYSTEM</text>
<text x="62" y="382" class="txt">Overview</text><text x="62" y="410" class="txt">Resources</text><text x="76" y="436" class="muted">CPU / Memory / Swap</text><text x="76" y="458" class="muted">Storage / Sensors</text><text x="76" y="480" class="muted">Processes → details</text><text x="62" y="512" class="txt">Devices</text><text x="76" y="538" class="muted">Displays / Audio</text><text x="76" y="560" class="muted">Input / Battery</text><text x="62" y="592" class="txt">Services → detail / logs</text><text x="62" y="620" class="txt">Logs → filter / follow</text><text x="62" y="648" class="txt">Updates → task view</text><text x="62" y="676" class="txt">Disks &amp; mounts</text><text x="62" y="704" class="txt">About</text><text x="62" y="732" class="txt">Power &amp; session</text>
