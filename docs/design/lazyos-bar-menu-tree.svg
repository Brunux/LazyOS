<text x="712" y="350" class="head">APPLICATIONS</text>
<text x="712" y="382" class="txt">Application launcher</text><text x="712" y="412" class="txt">Recent applications</text><text x="712" y="442" class="txt">Favorites</text><text x="712" y="472" class="txt">Default applications*</text><text x="712" y="502" class="txt">Run command</text><text x="726" y="528" class="muted">Command → execute / cancel</text><text x="712" y="580" class="muted">Actions are capability-gated.</text><text x="712" y="606" class="muted">No fake terminal command</text><text x="712" y="628" class="muted">execution; typed action IDs</text>
