<text x="32" y="180" class="mono yellow label">LAYOUT RULES</text>
<text x="32" y="210" class="mono text small">01  Fixed top layer · 30–34 px target height · one-pixel separators</text>
<text x="32" y="238" class="mono text small">02  Left: launcher + workspaces + compositor mode</text>
<text x="32" y="266" class="mono text small">03  Center: clock/date · right: compact system indicators</text>
<text x="32" y="294" class="mono text small">04  Sharp corners, monospaced labels, restrained transparency</text>
<text x="32" y="322" class="mono muted tiny">Conceptual reference — dimensions and glyphs are starting values, not pixel-locked assets.</text>
<text x="1110" y="180" class="mono yellow label">STATE LANGUAGE</text>
<text x="1110" y="210" class="mono cyan small">● healthy / connected</text>
<text x="1110" y="238" class="mono yellow small">● attention / activity</text>
<text x="1110" y="266" class="mono red small">● critical / disconnected</text>
<text x="1110" y="294" class="mono muted small">○ disabled / unavailable</text>
